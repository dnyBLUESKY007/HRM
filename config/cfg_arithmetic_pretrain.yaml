# Arithmetic training config

defaults:
  - arch: hrm_v1_arithmetic
  - _self_

hydra:
  output_subdir: null

wandb:
  entity: dnybluesky007-microsoft

# Data path
data_path: data/arithmetic-enhanced-balanced

# Hyperparams - Training
global_batch_size: 256

epochs: 5000
eval_interval: 500
checkpoint_every_eval: True

lr: 1e-4
lr_min_ratio: 0.1
lr_warmup_steps: 1000

# Standard hyperparameter settings for LM, as used in Llama
beta1: 0.9
beta2: 0.95
weight_decay: 1.0
puzzle_emb_weight_decay: 1.0

# Hyperparams - Puzzle embeddings training  
puzzle_emb_lr: 1e-4

# Evaluation settings
eval_save_outputs: ["inputs", "labels", "puzzle_identifiers", "logits"]